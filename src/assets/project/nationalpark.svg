<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGradPark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b12"/>
      <stop offset="50%" stop-color="#0a291c"/>
      <stop offset="100%" stop-color="#040e09"/>
    </linearGradient>
    <linearGradient id="forestGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowPark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGradPark)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="280" cy="220" r="200" fill="#10b981" opacity="0.18" filter="url(#glowPark)"/>
  <circle cx="950" cy="500" r="220" fill="#38bdf8" opacity="0.14" filter="url(#glowPark)"/>

  <!-- Left: Overview & Stack -->
  <g transform="translate(80, 100)">
    <rect width="210" height="38" rx="19" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">RESTFUL WEB API</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">National Park API</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">RESTful API for National Parks &amp; Trails with DTO Mapping</text>

    <!-- Stats -->
    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#0d3323" stroke="#175238"/>
      <text x="20" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="800">.NET Core</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Web API Platform</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#0d3323" stroke="#175238"/>
      <text x="20" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">DTO Mapping</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">AutoMapper Spec</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#0d3323" stroke="#175238"/>
      <text x="20" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Auth / JWT</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Role Authorization</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 280)">
      <rect width="105" height="32" rx="16" fill="#13432e" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="52" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">.NET Core</text>

      <rect x="115" width="95" height="32" rx="16" fill="#13432e" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="162" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Web API</text>

      <rect x="220" width="120" height="32" rx="16" fill="#13432e" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="280" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DTO Mapping</text>

      <rect x="350" width="115" height="32" rx="16" fill="#13432e" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="407" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CRUD Operations</text>

      <rect x="475" width="105" height="32" rx="16" fill="#13432e" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="527" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Swagger/UI</text>
    </g>
  </g>

  <!-- Right: Swagger & API Endpoints Mockup -->
  <g transform="translate(680, 110)">
    <rect width="440" height="520" rx="24" fill="#081e14" stroke="#134e35" stroke-width="2"/>

    <!-- Header -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 416 0 C 429.3 0 440 10.7 440 24 L 440 70 L 0 70 Z" fill="#0f3423"/>
    <text x="35" y="42" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">OpenAPI / Swagger 3.0 Documentation</text>
    <text x="35" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">● Base URL: /api/v1/nationalparks</text>

    <!-- Endpoints List -->
    <g transform="translate(25, 90)">
      <!-- GET /api/v1/nationalparks -->
      <rect width="390" height="54" rx="10" fill="#0c2e1f" stroke="#10b981"/>
      <rect x="12" y="12" width="55" height="30" rx="6" fill="#10b981"/>
      <text x="39" y="32" fill="#040e09" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GET</text>
      <text x="78" y="32" fill="#ffffff" font-family="monospace" font-size="13">/api/v1/nationalparks</text>
      <text x="315" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">List Parks</text>

      <!-- POST /api/v1/nationalparks -->
      <g transform="translate(0, 68)">
        <rect width="390" height="54" rx="10" fill="#0c2e1f" stroke="#0284c7"/>
        <rect x="12" y="12" width="55" height="30" rx="6" fill="#0284c7"/>
        <text x="39" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">POST</text>
        <text x="78" y="32" fill="#ffffff" font-family="monospace" font-size="13">/api/v1/nationalparks</text>
        <text x="305" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">[AUTH] DTO</text>
      </g>

      <!-- GET /api/v1/trails/{parkId} -->
      <g transform="translate(0, 136)">
        <rect width="390" height="54" rx="10" fill="#0c2e1f" stroke="#10b981"/>
        <rect x="12" y="12" width="55" height="30" rx="6" fill="#10b981"/>
        <text x="39" y="32" fill="#040e09" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GET</text>
        <text x="78" y="32" fill="#ffffff" font-family="monospace" font-size="13">/api/v1/trails/{parkId}</text>
        <text x="315" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Park Trails</text>
      </g>

      <!-- PATCH /api/v1/trails/{id} -->
      <g transform="translate(0, 204)">
        <rect width="390" height="54" rx="10" fill="#0c2e1f" stroke="#d97706"/>
        <rect x="12" y="12" width="55" height="30" rx="6" fill="#d97706"/>
        <text x="39" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PATCH</text>
        <text x="78" y="32" fill="#ffffff" font-family="monospace" font-size="13">/api/v1/trails/{id}</text>
        <text x="315" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Update Trail</text>
      </g>

      <!-- JSON Response Preview Box -->
      <g transform="translate(0, 275)">
        <rect width="390" height="115" rx="12" fill="#05140d" stroke="#134e35"/>
        <text x="16" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SAMPLE DTO PAYLOAD RESPONSE (200 OK)</text>
        <text x="16" y="46" fill="#94a3b8" font-family="monospace" font-size="10">{ "id": 101, "name": "Yosemite Falls Trail", "elevation": "2425 ft",</text>
        <text x="16" y="66" fill="#94a3b8" font-family="monospace" font-size="10">  "difficulty": "Strenuous", "distanceMiles": 7.2,</text>
        <text x="16" y="86" fill="#38bdf8" font-family="monospace" font-size="10">  "nationalPark": { "name": "Yosemite National Park", "state": "CA" } }</text>
      </g>
    </g>
  </g>
</svg>