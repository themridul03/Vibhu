    <!-- CRM Header -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 416 0 C 429.3 0 440 10.7 440 24 L 440 70 L 0 70 Z" fill="#0e2f3a"/>
    <text x="35" y="42" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Loan Portfolio &amp; Underwriting Dashboard</text>
    <text x="35" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">● Active Stored Procedures • Real-time Scoring</text>

    <!-- Top KPI cards -->
    <g transform="translate(25, 90)">
      <rect width="185" height="75" rx="12" fill="#0e303b" stroke="#155e75"/>
      <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Active Applications</text>
      <text x="16" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">1,482</text>
      <text x="120" y="54" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">+14.2%</text>

      <rect x="200" width="185" height="75" rx="12" fill="#0e303b" stroke="#155e75"/>
      <text x="216" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Avg Approval Speed</text>
      <text x="216" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">&lt; 15 min</text>
    </g>

    <!-- Applications Table List -->
    <g transform="translate(25, 180)">
      <rect width="390" height="310" rx="16" fill="#051216" stroke="#164e63"/>
      
      <!-- Table Header -->
      <path d="M 0 16 C 0 7.2 7.2 0 16 0 L 374 0 C 382.8 0 390 7.2 390 16 L 390 40 L 0 40 Z" fill="#0a242c"/>
      <text x="20" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">APPLICANT</text>
      <text x="150" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">LOAN TYPE</text>
      <text x="260" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AMOUNT</text>
      <text x="330" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STATUS</text>

      <!-- Row 1 -->
      <g transform="translate(20, 60)">
        <text x="0" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Robert Vance</text>
        <text x="130" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Commercial</text>
        <text x="240" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">$45,000</text>
        <rect x="305" y="2" width="60" height="20" rx="6" fill="#10b981" fill-opacity="0.2"/>
        <text x="335" y="16" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">APPROVED</text>
      </g>
      <line x1="20" y1="92" x2="370" y2="92" stroke="#164e63" stroke-width="0.8"/>

      <!-- Row 2 -->
      <g transform="translate(20, 110)">
        <text x="0" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Sarah Jenkins</text>
        <text x="130" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Home Loan</text>
        <text x="240" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">$180,000</text>
        <rect x="305" y="2" width="60" height="20" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="335" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">REVIEW</text>
      </g>
      <line x1="20" y1="142" x2="370" y2="142" stroke="#164e63" stroke-width="0.8"/>

      <!-- Row 3 -->
      <g transform="translate(20, 160)">
        <text x="0" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">David Miller</text>
        <text x="130" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Auto Finance</text>
        <text x="240" y="16" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">$28,500</text>
        <rect x="305" y="2" width="60" height="20" rx="6" fill="#10b981" fill-opacity="0.2"/>
        <text x="335" y="16" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">APPROVED</text>
      </g>
      <line x1="20" y1="192" x2="370" y2="192" stroke="#164e63" stroke-width="0.8"/>

      <!-- Stored proc footer -->
      <g transform="translate(20, 215)">
        <rect width="350" height="65" rx="10" fill="#081d24" stroke="#155e75"/>
        <text x="14" y="24" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SQL SERVER STORED PROC: usp_ProcessLoanUnderwriting</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Automated credit risk check • Sub-50ms execution • Indexed views</text>
      </g>
    </g>
