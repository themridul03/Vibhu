<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGradCrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1518"/>
      <stop offset="50%" stop-color="#0e2329"/>
      <stop offset="100%" stop-color="#050c0e"/>
    </linearGradient>
    <linearGradient id="tealEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowCrm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGradCrm)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#14b8a6" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="280" cy="220" r="200" fill="#0d9488" opacity="0.18" filter="url(#glowCrm)"/>
  <circle cx="950" cy="500" r="220" fill="#0284c7" opacity="0.15" filter="url(#glowCrm)"/>

  <!-- Left: Overview & Stack -->
  <g transform="translate(80, 100)">
    <rect width="210" height="38" rx="19" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-opacity="0.6"/>
    <circle cx="22" cy="19" r="6" fill="#14b8a6"/>
    <text x="38" y="24" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ENTERPRISE FINTECH</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Loan Management CRM</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">End-to-End User Registration &amp; Loan Application Platform</text>

    <!-- Stats -->
    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#0f2b33" stroke="#1a4854"/>
      <text x="20" y="36" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="24" font-weight="800">.NET MVC</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Core Business Logic</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#0f2b33" stroke="#1a4854"/>
      <text x="20" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Vue &amp; Angular</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dual Client Suites</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#0f2b33" stroke="#1a4854"/>
      <text x="20" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Stored Procs</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">SQL Optimization</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 280)">
      <rect width="115" height="32" rx="16" fill="#143640" stroke="#0d9488" stroke-opacity="0.4"/>
      <text x="57" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">.NET MVC</text>

      <rect x="125" width="85" height="32" rx="16" fill="#143640" stroke="#0d9488" stroke-opacity="0.4"/>
      <text x="167" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Vue.js</text>

      <rect x="220" width="85" height="32" rx="16" fill="#143640" stroke="#0d9488" stroke-opacity="0.4"/>
      <text x="262" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Angular</text>

      <rect x="315" width="115" height="32" rx="16" fill="#143640" stroke="#0d9488" stroke-opacity="0.4"/>
      <text x="372" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQL Server</text>

      <rect x="440" width="130" height="32" rx="16" fill="#143640" stroke="#0d9488" stroke-opacity="0.4"/>
      <text x="505" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Loan Workflow</text>
    </g>
