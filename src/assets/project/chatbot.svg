<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGradChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="50%" stop-color="#061c3b"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="azureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00bcf2"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#00ffae"/>
    </linearGradient>
    <filter id="glowChat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGradChat)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#00bcf2" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="280" cy="220" r="200" fill="#0078d4" opacity="0.18" filter="url(#glowChat)"/>
  <circle cx="950" cy="500" r="220" fill="#10a37f" opacity="0.15" filter="url(#glowChat)"/>

  <!-- Left: Branding & Metrics -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="210" height="38" rx="19" fill="#0078d4" fill-opacity="0.15" stroke="#00bcf2" stroke-opacity="0.5"/>
    <circle cx="22" cy="19" r="6" fill="#00bcf2"/>
    <text x="38" y="24" fill="#00bcf2" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LIVE AZURE PROJECT</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Microsoft Chatbot</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Multi-Region Customer Order Returns AI • US, UK, CA, EU</text>

    <!-- Stat Badges -->
    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#081e3d" stroke="#103a6e"/>
      <text x="20" y="36" fill="#00bcf2" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Azure Cloud</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Bot Framework</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#081e3d" stroke="#103a6e"/>
      <text x="20" y="36" fill="#00ffae" font-family="system-ui, sans-serif" font-size="24" font-weight="800">OpenAI + LUIS</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Intent &amp; NLP</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#081e3d" stroke="#103a6e"/>
      <text x="20" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">4 Regions</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">US, UK, CA, Europe</text>
    </g>

    <!-- Tech Stack Pill Group -->
    <g transform="translate(0, 280)">
      <rect width="105" height="32" rx="16" fill="#0e2a52" stroke="#1d4ed8" stroke-opacity="0.4"/>
      <text x="52" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Azure Bot</text>

      <rect x="115" width="95" height="32" rx="16" fill="#0e2a52" stroke="#1d4ed8" stroke-opacity="0.4"/>
      <text x="162" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenAI</text>

      <rect x="220" width="90" height="32" rx="16" fill="#0e2a52" stroke="#1d4ed8" stroke-opacity="0.4"/>
      <text x="265" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LUIS AI</text>

      <rect x="320" width="125" height="32" rx="16" fill="#0e2a52" stroke="#1d4ed8" stroke-opacity="0.4"/>
      <text x="382" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ASP.NET MVC</text>

      <rect x="455" width="125" height="32" rx="16" fill="#0e2a52" stroke="#1d4ed8" stroke-opacity="0.4"/>
      <text x="517" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ASP.NET Core</text>
    </g>
  </g>

  <!-- Right: Interactive Bot Simulation Mockup -->
  <g transform="translate(680, 110)">
    <!-- Container Card -->
    <rect width="440" height="520" rx="24" fill="#07152b" stroke="#173563" stroke-width="2"/>
    
    <!-- Header of Bot Window -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 416 0 C 429.3 0 440 10.7 440 24 L 440 70 L 0 70 Z" fill="#0a2145"/>
    <circle cx="35" cy="35" r="14" fill="#0078d4"/>
    <text x="35" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🤖</text>
    <text x="60" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Azure Return Assistant</text>
    <text x="60" y="52" fill="#00ffae" font-family="system-ui, sans-serif" font-size="11">● Active • Multi-Region Bot Service</text>

    <!-- Message Bubble 1 (Bot) -->
    <g transform="translate(25, 95)">
      <rect width="320" height="70" rx="16" fill="#0f2b57" stroke="#1e4b8a"/>
      <text x="18" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Hello! I can assist with furniture order returns</text>
      <text x="18" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">across US, UK, Canada, and Europe.</text>
    </g>

    <!-- Message Bubble 2 (User) -->
    <g transform="translate(135, 185)">
      <rect width="280" height="60" rx="16" fill="#0078d4"/>
      <text x="18" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">I need to return order #UK-8921</text>
      <text x="18" y="46" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12">Damaged armrest during transit.</text>
    </g>

    <!-- Message Bubble 3 (Bot AI Intent) -->
    <g transform="translate(25, 265)">
      <rect width="340" height="95" rx="16" fill="#0f2b57" stroke="#10a37f" stroke-width="1.5"/>
      <text x="18" y="26" fill="#00ffae" font-family="system-ui, sans-serif" font-size="11" font-weight="700">LUIS AI Intent Recognized: ReturnRequest.Damaged</text>
      <text x="18" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Order found: Velvet 3-Seater Sofa (UK Store).</text>
      <text x="18" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Free return label generated &amp; courier notified.</text>
    </g>

    <!-- Admin Panel Summary Box -->
    <g transform="translate(25, 385)">
      <rect width="390" height="105" rx="16" fill="#051021" stroke="#1e4b8a" stroke-dasharray="4 4"/>
      <text x="18" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ASP.NET MVC ADMIN TRACKING PANEL</text>
      <text x="18" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Real-time sync to Customer Support Queue</text>
      <text x="18" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Automated RMA #RMA-UK-44129 • Resolution time: &lt; 2 min</text>
      <rect x="290" y="45" width="85" height="26" rx="8" fill="#00ffae" fill-opacity="0.2" stroke="#00ffae"/>
      <text x="332" y="62" fill="#00ffae" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">APPROVED</text>
    </g>
  </g>
</svg>