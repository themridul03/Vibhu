<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGradBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#2b1a08"/>
      <stop offset="100%" stop-color="#0e0803"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowBook" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGradBook)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="280" cy="220" r="200" fill="#f59e0b" opacity="0.18" filter="url(#glowBook)"/>
  <circle cx="950" cy="500" r="220" fill="#ea580c" opacity="0.15" filter="url(#glowBook)"/>

  <!-- Left: Overview & Stack -->
  <g transform="translate(80, 100)">
    <rect width="210" height="38" rx="19" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.6"/>
    <circle cx="22" cy="19" r="6" fill="#f59e0b"/>
    <text x="38" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">E-COMMERCE PLATFORM</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Online Book Store</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Full-Stack E-Commerce Platform in ASP.NET MVC &amp; SQL Server</text>

    <!-- Stats -->
    <g transform="translate(0, 175)">
      <rect width="150" height="75" rx="16" fill="#38220b" stroke="#5a3812"/>
      <text x="20" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">ASP.NET MVC</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Architecture</text>
    </g>

    <g transform="translate(170, 175)">
      <rect width="150" height="75" rx="16" fill="#38220b" stroke="#5a3812"/>
      <text x="20" y="36" fill="#f97316" font-family="system-ui, sans-serif" font-size="24" font-weight="800">SQL Server</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Catalog &amp; Cart DB</text>
    </g>

    <g transform="translate(340, 175)">
      <rect width="150" height="75" rx="16" fill="#38220b" stroke="#5a3812"/>
      <text x="20" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="24" font-weight="800">C# .NET</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Order Lifecycle</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 280)">
      <rect width="125" height="32" rx="16" fill="#42280d" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="62" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ASP.NET MVC</text>

      <rect x="135" width="70" height="32" rx="16" fill="#42280d" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="170" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">C#</text>

      <rect x="215" width="110" height="32" rx="16" fill="#42280d" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="270" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQL Server</text>

      <rect x="335" width="125" height="32" rx="16" fill="#42280d" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="397" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Shopping Cart</text>

      <rect x="470" width="115" height="32" rx="16" fill="#42280d" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="527" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Admin Panel</text>
    </g>
  </g>

  <!-- Right: Bookstore Mockup -->
  <g transform="translate(680, 110)">
    <rect width="440" height="520" rx="24" fill="#170e05" stroke="#4a2c0c" stroke-width="2"/>

    <!-- Header -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 416 0 C 429.3 0 440 10.7 440 24 L 440 70 L 0 70 Z" fill="#2b1908"/>
    <text x="35" y="42" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Book Store Catalog &amp; Cart Management</text>
    <text x="35" y="58" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">● Live Inventory • Instant Checkout</text>

    <!-- Book Grid Mockup -->
    <g transform="translate(25, 90)">
      <!-- Book 1 -->
      <rect width="185" height="185" rx="14" fill="#241507" stroke="#4a2c0c"/>
      <rect x="15" y="15" width="55" height="75" rx="4" fill="#d97706"/>
      <text x="42" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">C# 12</text>
      <text x="80" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Pro C# &amp; .NET</text>
      <text x="80" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Andrew Troelsen</text>
      <text x="80" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">$49.99</text>
      <rect x="15" y="130" width="155" height="36" rx="8" fill="#f59e0b"/>
      <text x="92" y="152" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Add to Cart</text>

      <!-- Book 2 -->
      <g transform="translate(200, 0)">
        <rect width="185" height="185" rx="14" fill="#241507" stroke="#4a2c0c"/>
        <rect x="15" y="15" width="55" height="75" rx="4" fill="#0284c7"/>
        <text x="42" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SQL</text>
        <text x="80" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SQL Server</text>
        <text x="80" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Itzik Ben-Gan</text>
        <text x="80" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">$42.50</text>
        <rect x="15" y="130" width="155" height="36" rx="8" fill="#f59e0b"/>
        <text x="92" y="152" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Add to Cart</text>
      </g>
    </g>

    <!-- Shopping Cart Bottom Tray -->
    <g transform="translate(25, 300)">
      <rect width="390" height="185" rx="16" fill="#120a03" stroke="#4a2c0c"/>
      <text x="20" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SHOPPING CART &amp; ORDER FULFILLMENT</text>
      
      <g transform="translate(20, 50)">
        <text x="0" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Items in Cart: 2 items</text>
        <text x="260" y="18" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Subtotal: $92.49</text>
        
        <line x1="0" y1="36" x2="350" y2="36" stroke="#2b1908" stroke-width="1"/>
        <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Modules: Admin • User Auth • Profile • Order Lifecycle</text>
        <text x="0" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Built with ASP.NET MVC architecture and relational SQL Server</text>

        <rect x="0" y="95" width="350" height="30" rx="8" fill="#d97706"/>
        <text x="175" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Proceed to Secure Checkout →</text>
      </g>
    </g>
  </g>
</svg>